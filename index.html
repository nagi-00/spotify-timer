<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Neumorphic Pomodoro</title>
    <style>
        :root {
            --bg-color: #f3e7e7;
            --theme-color: #d1a4a4;
            --text-main: #333;
            --text-sub: #8e8e8e;
            --shadow: #d1c5c5;
            --white: #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Apple SD Gothic Neo', sans-serif; }
        body { 
            margin: 0; min-height: 100vh; display: flex; align-items: center; 
            justify-content: center; background: #e0e0e0; 
        }

        .container { position: relative; width: 360px; height: 640px; }

        /* 설정창 스타일 */
        .window {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color); border-radius: 50px; z-index: 20;
            padding: 40px; display: flex; flex-direction: column;
            box-shadow: 20px 20px 60px #bebebe; transition: 0.5s;
        }
        .step { display: none; flex-direction: column; height: 100%; }
        .step.active { display: flex; }
        input { 
            width: 100%; padding: 15px; border: none; border-radius: 15px; 
            background: var(--bg-color); box-shadow: inset 5px 5px 10px var(--shadow), inset -5px -5px 10px var(--white);
            outline: none; margin-bottom: 20px;
        }

        /* 위젯 본체 */
        .widget-card {
            width: 100%; height: 100%; background: var(--bg-color);
            border-radius: 50px; padding: 40px 30px; display: flex; flex-direction: column;
            box-shadow: 20px 20px 60px #bebebe, -20px -20px 60px #ffffff;
        }

        .header { margin-bottom: 30px; }
        .created-by { font-size: 10px; color: var(--text-sub); opacity: 0.6; margin-bottom: 5px; }
        .main-title { font-size: 24px; font-weight: 900; margin: 0; }

        .main-container { display: flex; justify-content: space-between; align-items: center; flex: 1; }

        /* 좌측 알약 사이드바 */
        .side-bar {
            width: 60px; height: 360px; background: var(--bg-color);
            border-radius: 40px; box-shadow: inset 6px 6px 12px var(--shadow), inset -6px -6px 12px var(--white);
            display: flex; flex-direction: column; justify-content: space-around; align-items: center;
        }
        .mode-btn { font-size: 22px; cursor: pointer; opacity: 0.4; transition: 0.3s; }
        .mode-btn.active { opacity: 1; transform: scale(1.2); }

        /* 원형 타이머 (SVG 활용) */
        .timer-box { position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
        svg { position: absolute; transform: rotate(-90deg); width: 220px; height: 220px; }
        circle { fill: none; stroke-width: 8; stroke-linecap: round; }
        .track { stroke: var(--white); opacity: 0.3; }
        .progress { 
            stroke: var(--theme-color); stroke-dasharray: 628; stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
        }
        
        .timer-inner {
            width: 160px; height: 160px; border-radius: 50%; background: var(--theme-color);
            box-shadow: 5px 5px 15px #b08a8a, -5px -5px 15px #f2cece;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; cursor: pointer; z-index: 5;
        }

        /* 조절 핸들(흰색 점) */
        #handle { fill: white; filter: drop-shadow(0 0 5px rgba(0,0,0,0.2)); transition: all 1s linear; }

        .tab-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; }
        .tab-btn {
            width: 55px; height: 55px; border-radius: 15px; 
            box-shadow: 5px 5px 10px var(--shadow), -5px -5px 10px var(--white);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        body.is-embed .window { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div class="window" id="setupWindow">
            <div id="step1" class="step active">
                <h2>Design</h2>
                <input type="color" id="colorPicker" value="#d1a4a4" oninput="updateTheme(this.value)">
                <input type="text" id="titleInput" placeholder="Widget Title" oninput="liveUpdate()">
                <button onclick="moveStep(2)">Next</button>
            </div>
            <div id="step2" class="step">
                <h2>Time</h2>
                <input type="number" id="fTime" value="25" placeholder="Focus">
                <input type="number" id="sTime" value="5" placeholder="Break">
                <button onclick="generateUrl()">Complete</button>
            </div>
        </div>

        <div class="widget-card">
            <div class="header">
                <div class="created-by" id="dUser">created by [YOUR NAME]</div>
                <h1 class="main-title" id="dTitle">POMODORO SESSIONS</h1>
            </div>

            <div class="main-container">
                <div class="side-bar">
                    <div class="mode-btn active" onclick="setMode('focus', 25)">🔥</div>
                    <div class="mode-btn" onclick="setMode('short', 5)">☕</div>
                    <div class="mode-btn" onclick="setMode('long', 15)">🌴</div>
                    <div class="mode-btn">🏆</div>
                </div>

                <div class="timer-box">
                    <svg viewBox="0 0 220 220">
                        <circle class="track" cx="110" cy="110" r="100"></circle>
                        <circle class="progress" id="progressCircle" cx="110" cy="110" r="100"></circle>
                        <circle id="handle" cx="210" cy="110" r="6"></circle>
                    </svg>
                    <div class="timer-inner" onclick="toggleTimer()">
                        <div style="font-size: 32px; font-weight: 800;" id="percentDisp">100%</div>
                        <div style="font-size: 20px; opacity: 0.9;" id="timeDisp">25:00</div>
                    </div>
                </div>
            </div>

            <div class="tab-bar">
                <div class="tab-btn">🏠</div>
                <div class="tab-btn" style="box-shadow: inset 4px 4px 8px var(--shadow);">🎵</div>
                <div class="tab-btn">📷</div>
                <div class="tab-btn">✉️</div>
            </div>
        </div>
    </div>

    <script>
        let state = {
            isRunning: false,
            timeLeft: 1500,
            totalTime: 1500,
            timerId: null
        };

        function updateTheme(hex) {
            document.documentElement.style.setProperty('--theme-color', hex);
        }

        function toggleTimer() {
            if (state.isRunning) {
                clearInterval(state.timerId);
                state.isRunning = false;
            } else {
                state.isRunning = true;
                state.timerId = setInterval(() => {
                    state.timeLeft--;
                    updateUI();
                    if (state.timeLeft <= 0) {
                        clearInterval(state.timerId);
                        alert("Done!");
                    }
                }, 1000);
            }
        }

        function updateUI() {
            const m = Math.floor(state.timeLeft / 60);
            const s = state.timeLeft % 60;
            document.getElementById('timeDisp').innerText = `${m}:${s.toString().padStart(2, '0')}`;
            
            const ratio = state.timeLeft / state.totalTime;
            const offset = 628 * (1 - ratio);
            document.getElementById('progressCircle').style.strokeDashoffset = offset;
            document.getElementById('percentDisp').innerText = Math.round(ratio * 100) + "%";

            // 핸들 위치 계산
            const angle = (ratio * 360) - 90;
            const x = 110 + 100 * Math.cos(angle * Math.PI / 180);
            const y = 110 + 100 * Math.sin(angle * Math.PI / 180);
            const handle = document.getElementById('handle');
            handle.setAttribute('cx', x);
            handle.setAttribute('cy', y);
        }

        function moveStep(n) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById(`step${n}`).classList.add('active');
        }

        function liveUpdate() {
            document.getElementById('dTitle').innerText = document.getElementById('titleInput').value;
        }

        // 초기화 로직 및 모드 설정 함수 추가...
    </script>
</body>
</html>
