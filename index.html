<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Pomodoro</title>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --theme-color: #e8bcbc;
            --text-main: #44474a;
            --text-sub: #797d82;
            --shadow-light: 9px 9px 16px #bec8d4, -9px -9px 16px #ffffff;
            --shadow-inset: inset 6px 6px 10px #bec8d4, inset -6px -6px 10px #ffffff;
            --shadow-small: 4px 4px 8px #bec8d4, -4px -4px 8px #ffffff;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { 
            margin: 0; min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; background: var(--bg-color); 
            color: var(--text-main); 
        }

        /* 위젯과 온보딩을 감싸는 컨테이너 */
        .container { position: relative; width: 340px; height: 600px; }

        /* 공통 카드 스타일 */
        .card {
            position: absolute; width: 100%; height: 100%; 
            background: var(--bg-color); border-radius: 40px;
            box-shadow: var(--shadow-light); padding: 30px;
            display: flex; flex-direction: column; transition: 0.5s ease-in-out;
        }

        /* 온보딩 창 (설정 중일 때만 보임) */
        #setupWindow { z-index: 10; opacity: 1; transform: scale(1); }
        body.is-embed #setupWindow { display: none; }
        
        .step { display: none; }
        .step.active { display: flex; flex-direction: column; height: 100%; }
        
        h2 { font-size: 20px; margin: 20px 0; }
        input { 
            width: 100%; padding: 12px; border: none; border-radius: 12px; 
            background: var(--bg-color); box-shadow: var(--shadow-inset); 
            outline: none; margin-bottom: 15px; color: var(--text-main);
        }

        /* 위젯 본체 */
        .widget-card { z-index: 5; }

        .header { text-align: center; margin-bottom: 30px; }
        .main-title { font-size: 20px; font-weight: 800; margin: 0; color: var(--text-main); }
        
        .main-content { display: flex; align-items: center; justify-content: space-between; flex: 1; }

        /* 좌측 사이드 바 */
        .side-bar {
            width: 55px; height: 280px; border-radius: 20px;
            box-shadow: var(--shadow-inset); display: flex; flex-direction: column;
            justify-content: space-around; align-items: center;
        }
        .mode-btn {
            width: 38px; height: 38px; border-radius: 10px; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            transition: 0.2s; color: var(--text-sub);
        }
        .mode-btn.active { 
            box-shadow: var(--shadow-small); color: var(--theme-color); 
        }

        /* 타이머 영역 */
        .timer-container {
            position: relative; width: 200px; height: 200px;
            border-radius: 50%; box-shadow: var(--shadow-light);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .timer-inner {
            width: 160px; height: 160px; border-radius: 50%;
            background: var(--bg-color); box-shadow: var(--shadow-inset);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2;
        }
        .timer-fill {
            position: absolute; bottom: 0; width: 100%; background: var(--theme-color);
            opacity: 0.15; border-radius: 50%; transition: height 0.3s;
        }

        .time-val { font-size: 28px; font-weight: 800; }
        .percent-val { font-size: 14px; color: var(--text-sub); }

        /* 하단 탭바 */
        .tab-bar { display: flex; justify-content: space-between; margin-top: 30px; }
        .tab-btn {
            width: 50px; height: 50px; border-radius: 15px; 
            box-shadow: var(--shadow-small); display: flex;
            align-items: center; justify-content: center; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card" id="setupWindow">
            <div id="step1" class="step active">
                <p style="font-size: 12px; color: var(--theme-color);">STEP 01</p>
                <h2>Design Your Timer</h2>
                <label>Theme Color</label>
                <input type="color" id="colorPicker" value="#e8bcbc" oninput="updateTheme(this.value)">
                <label>Widget Title</label>
                <input type="text" id="titleInput" placeholder="Enter Title..." oninput="liveUpdate()">
                <button class="tab-btn" style="width:100%; margin-top: auto;" onclick="moveStep(2)">Next</button>
            </div>
            <div id="step2" class="step">
                <p style="font-size: 12px; color: var(--theme-color);">STEP 02</p>
                <h2>Set Duration</h2>
                <label>Focus (min)</label>
                <input type="number" id="fTime" value="25">
                <label>Short Break (min)</label>
                <input type="number" id="sTime" value="5">
                <div style="display: flex; gap: 10px; margin-top: auto;">
                    <button class="tab-btn" style="flex:1" onclick="moveStep(1)">Back</button>
                    <button class="tab-btn" style="flex:2" onclick="generateUrl()">Complete</button>
                </div>
            </div>
        </div>

        <div class="card widget-card">
            <div class="header">
                <h1 class="main-title" id="dTitle">POMODORO</h1>
                <p style="font-size: 11px; color: var(--text-sub);">Stay focus with music</p>
            </div>

            <div class="main-content">
                <div class="side-bar">
                    <div class="mode-btn active" onclick="setMode('focus', this)">🔥</div>
                    <div class="mode-btn" onclick="setMode('short', this)">☕</div>
                    <div class="mode-btn" onclick="setMode('long', this)">🌴</div>
                </div>

                <div class="timer-container" onclick="toggleTimer()">
                    <div class="timer-fill" id="timerFill"></div>
                    <div class="timer-inner">
                        <div class="time-val" id="timeDisp">25:00</div>
                        <div class="percent-val" id="percentDisp">100%</div>
                    </div>
                </div>
            </div>

            <div class="tab-bar">
                <div class="tab-btn">🏠</div>
                <div class="tab-btn">🎵</div>
                <div class="tab-btn">⚙️</div>
            </div>
        </div>
    </div>

    <script>
        // ... (기존 스크립트 로직 유지 및 UI 업데이트 함수 연결)
        // 위 CSS 구조에 맞게 state와 updateUI 함수를 실행하면 뉴몰피즘 위젯이 완성됩니다.
    </script>
</body>
</html>
